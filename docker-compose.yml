version: "3.8"

services:
  migrate:
    build: .
    container_name: minio-migrate
    env_file: .env
    # Share host network so container resolves local hostnames (e.g. storagevds)
    # same as your browser does. Remove if both endpoints use public DNS/IPs.
    network_mode: host

